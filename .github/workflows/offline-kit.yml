name: Offline kit

# Generează kitul pentru dezvoltare offline (pachete NuGet + npm, git bundle, kituri de instalare Windows).
# Pornire: manual (Actions → Offline kit → Run workflow) sau automat la modificări în offline/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'offline/**'
      - '.github/workflows/offline-kit.yml'

jobs:
  offline-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tot istoricul, pentru git bundle
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./offline/create-offline-bundle.sh --with-installers
      - uses: actions/upload-artifact@v4
        with:
          name: mdel-offline-kit
          path: offline
          retention-days: 90
